<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GuestConnect</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .top {
            background: #111827;
            color: white;
            text-align: center;
            padding: 22px 15px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .tagline {
            margin-top: 5px;
            font-size: 14px;
            opacity: 0.8;
        }

        .container {
            max-width: 500px;
            margin: 25px auto;
            padding: 0 16px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 25px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .restaurant-name {
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 6px;
        }

        .location {
            text-align: center;
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .wifi-box {
            background: #f3f4f6;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .wifi-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .wifi-row {
            margin-bottom: 16px;
        }

        .wifi-label {
            display: block;
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .wifi-value {
            font-size: 17px;
            font-weight: bold;
            word-break: break-word;
        }

        .password-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .password-text {
            flex: 1;
            font-size: 17px;
            font-weight: bold;
            word-break: break-word;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 11px 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .copy-button {
            background: #111827;
            color: white;
            white-space: nowrap;
        }

        .instructions {
            margin-top: 20px;
            padding: 17px;
            background: #eef2ff;
            border-radius: 14px;
        }

        .instructions-title {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .instructions p {
            margin: 7px 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .status {
            text-align: center;
            padding: 25px 10px;
            font-size: 17px;
        }

        .error {
            color: #b91c1c;
            text-align: left;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-bottom: 25px;
            color: #9ca3af;
            font-size: 13px;
        }

        .ad-space {
            margin-top: 22px;
            padding: 14px;
            border: 1px dashed #d1d5db;
            border-radius: 12px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 420px) {

            .restaurant-name {
                font-size: 27px;
            }

            .card {
                padding: 22px 16px;
            }

            .password-row {
                flex-direction: column;
                align-items: stretch;
            }

            .copy-button {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <div class="top">

        <div class="logo">
            GuestConnect
        </div>

        <div class="tagline">
            Restaurant Wi-Fi made simple.
        </div>

    </div>



    <div class="container">


        <div id="loading"
             class="card status">

            Loading restaurant...

        </div>



        <div id="restaurantCard"
             class="card"
             style="display:none;">


            <div id="restaurantName"
                 class="restaurant-name">
            </div>


            <div id="restaurantLocation"
                 class="location">
            </div>



            <div class="wifi-box">


                <div class="wifi-title">
                    📶 Wi-Fi Details
                </div>


                <div class="wifi-row">

                    <span class="wifi-label">
                        Network name
                    </span>

                    <div id="wifiName"
                         class="wifi-value">
                    </div>

                </div>



                <div class="wifi-row">

                    <span class="wifi-label">
                        Password
                    </span>


                    <div class="password-row">

                        <div id="wifiPassword"
                             class="password-text">
                        </div>


                        <button id="copyButton"
                                class="copy-button"
                                onclick="copyPassword()">

                            Copy Password

                        </button>

                    </div>

                </div>


            </div>



            <div class="instructions">

                <div class="instructions-title">
                    How to connect
                </div>


                <p>
                    1. Open your phone's Wi-Fi settings.
                </p>


                <p>
                    2. Select the restaurant's Wi-Fi network.
                </p>


                <p>
                    3. Enter the password shown above.
                </p>

            </div>



            <div class="ad-space">

                Advertisement

            </div>


        </div>



        <div id="errorBox"
             class="card status error"
             style="display:none;">
        </div>



        <div class="footer">

            Powered by GuestConnect

        </div>


    </div>



<script>


    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
        "https://ksrsjhwklrwrfgzkqcbi.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_bLtm1wBIxmZvwLteiMA2tg_BtLHhgGc";


    const supabaseClient =
        window.supabase.createClient(

            SUPABASE_URL,

            SUPABASE_PUBLISHABLE_KEY,

            {
                auth: {

                    persistSession: false,

                    autoRefreshToken: false,

                    detectSessionInUrl: false

                }
            }

        );



    // ==========================================
    // GET TOKEN FROM URL
    // ==========================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const publicToken =
        params.get("token");



    let currentPassword = "";

    let currentRestaurantID = "";



    // ==========================================
    // LOAD RESTAURANT
    // ==========================================

    async function loadRestaurant() {


        if (!publicToken) {

            showError(
                "No restaurant token was found in this QR link."
            );

            return;

        }



        console.log(
            "GuestConnect public token:",
            publicToken
        );



        const { data, error } =

            await supabaseClient

                .rpc(
                    "get_public_restaurant",
                    {
                        p_token: publicToken
                    }
                );



        if (error) {

            console.error(
                "GuestConnect lookup error:",
                error
            );


            showError(
                "Could not load restaurant information.\n\n" +
                error.message
            );


            return;

        }



        if (!data || data.length === 0) {

            showError(
                "Restaurant not found."
            );


            return;

        }



        const restaurant =
            data[0];



        currentRestaurantID =
            restaurant.id;


        currentPassword =
            restaurant.wifi_password;



        document.getElementById(
            "restaurantName"
        ).textContent =
            restaurant.name;


        document.getElementById(
            "restaurantLocation"
        ).textContent =
            restaurant.location;


        document.getElementById(
            "wifiName"
        ).textContent =
            restaurant.wifi_name;


        document.getElementById(
            "wifiPassword"
        ).textContent =
            restaurant.wifi_password;



        document.getElementById(
            "loading"
        ).style.display =
            "none";


        document.getElementById(
            "restaurantCard"
        ).style.display =
            "block";


        console.log(
            "Restaurant loaded successfully."
        );


    }



    // ==========================================
    // RECORD VISIT
    // ==========================================

    async function recordVisit() {


        if (!publicToken) {

            return;

        }



        const { data, error } =

            await supabaseClient

                .rpc(
                    "get_public_restaurant",
                    {
                        p_token: publicToken
                    }
                );



        if (error) {

            console.error(
                "Could not identify restaurant for visit:",
                error
            );

            return;

        }



        if (!data || data.length === 0) {

            return;

        }



        const restaurantID =
            data[0].id;



        const { data: visitResult, error: visitError } =

            await supabaseClient

                .rpc(
                    "record_public_visit",
                    {
                        p_restaurant_id:
                            restaurantID
                    }
                );



        if (visitError) {

            console.error(
                "GuestConnect visit error:",
                visitError
            );

            return;

        }



        console.log(
            "GuestConnect visit recorded:",
            visitResult
        );

    }



    // ==========================================
    // COPY PASSWORD
    // ==========================================

    async function copyPassword() {


        if (!currentPassword) {

            return;

        }



        const button =
            document.getElementById(
                "copyButton"
            );



        try {


            await navigator.clipboard.writeText(
                currentPassword
            );


            button.textContent =
                "Copied!";


            setTimeout(

                function() {

                    button.textContent =
                        "Copy Password";

                },

                2000

            );


        }

        catch (error) {


            console.error(
                "Copy failed:",
                error
            );


            alert(
                "Copy was not available. Please copy the password manually."
            );

        }

    }



    // ==========================================
    // ERROR
    // ==========================================

    function showError(message) {


        document.getElementById(
            "loading"
        ).style.display =
            "none";


        const errorBox =
            document.getElementById(
                "errorBox"
            );


        errorBox.textContent =
            message;


        errorBox.style.display =
            "block";

    }



    // ==========================================
    // START
    // ==========================================

    loadRestaurant();

    recordVisit();


</script>


</body>

</html>
