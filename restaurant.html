<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GuestConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef6ff;
            color: #1f2937;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .card {
            background: white;

            width: 90%;
            max-width: 430px;

            padding: 35px 25px;

            border-radius: 18px;

            text-align: center;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .wifi-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;

            color: #0d6efd;

            font-size: 30px;
        }

        .location {
            margin-top: 6px;

            color: #64748b;

            font-size: 16px;
        }

        .line {
            height: 1px;

            background: #e2e8f0;

            margin: 25px 0;
        }

        .wifi-label {
            font-size: 14px;

            color: #64748b;

            margin-bottom: 6px;
        }

        .wifi-name {
            font-size: 22px;

            font-weight: bold;

            margin-bottom: 20px;
        }

        .password-box {
            background: #f1f5f9;

            padding: 15px;

            border-radius: 10px;

            font-size: 20px;

            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 15px;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background: #0d6efd;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #0b5ed7;
        }

        .footer {
            margin-top: 25px;

            font-size: 12px;

            color: #94a3b8;
        }

        .error {
            color: #dc3545;

            font-weight: bold;

            line-height: 1.5;
        }
    </style>
</head>


<body>

<div class="card">

    <div class="wifi-icon">
        📶
    </div>

    <h1 id="restaurantName">
        GuestConnect
    </h1>

    <div
        class="location"
        id="locationName">
    </div>


    <div class="line"></div>


    <div class="wifi-label">
        Wi-Fi Network
    </div>

    <div
        class="wifi-name"
        id="wifiName">
    </div>


    <div class="wifi-label">
        Wi-Fi Password
    </div>

    <div
        class="password-box"
        id="wifiPassword">
    </div>


    <button onclick="copyPassword()">
        Copy Password
    </button>


    <div class="footer">
        Powered by GuestConnect
    </div>

</div>


<script>

    // Get the restaurant ID from the URL
    const urlParams = new URLSearchParams(
        window.location.search
    );

    const restaurantID =
        urlParams.get("id");


    // Get restaurants saved by the Admin page
    const restaurants =
        JSON.parse(
            localStorage.getItem(
                "guestconnectRestaurants"
            )
        ) || [];


    // Find the restaurant with the matching ID
    const restaurant =
        restaurants.find(
            restaurant =>
                restaurant.id === restaurantID
        );


    // If restaurant exists, display its information
    if (restaurant) {

        document.getElementById(
            "restaurantName"
        ).textContent =
            restaurant.name;


        document.getElementById(
            "locationName"
        ).textContent =
            restaurant.location;


        document.getElementById(
            "wifiName"
        ).textContent =
            restaurant.wifiName;


        document.getElementById(
            "wifiPassword"
        ).textContent =
            restaurant.wifiPassword;

    }


    // If restaurant does not exist
    else {

        document.querySelector(
            ".card"
        ).innerHTML = `

            <div class="wifi-icon">
                📶
            </div>

            <h1>
                Restaurant Not Found
            </h1>

            <p class="error">
                We could not find this restaurant.
            </p>

            <div class="footer">
                Powered by GuestConnect
            </div>

        `;

    }


    // Copy Wi-Fi password
    function copyPassword() {

        if (!restaurant) {
            return;
        }


        navigator.clipboard.writeText(
            restaurant.wifiPassword
        );


        const button =
            document.querySelector("button");


        button.textContent =
            "Password Copied!";


        setTimeout(() => {

            button.textContent =
                "Copy Password";

        }, 2000);

    }

</script>

</body>
</html>
