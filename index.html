<!DOCTYPE html>
<html>

<head>

    <title>Free Wi-Fi</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            color: #1a1a1a;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .wifi-card {
            background-color: white;
            border-radius: 20px;
            padding: 30px 25px;
            text-align: center;

            box-shadow: 0 8px 25px rgba(0, 100, 200, 0.12);
        }

        .wifi-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 30px;
            color: #0875e1;
        }

        .restaurant {
            font-size: 20px;
            margin-top: 8px;
            color: #555;
            font-weight: bold;
        }

        .location {
            font-size: 15px;
            color: #888;
            margin-top: 4px;
        }

        .divider {
            height: 1px;
            background-color: #e0eaf3;
            margin: 25px 0;
        }

        .info-box {
            background-color: #f3f8fd;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .info-label {
            font-size: 13px;
            color: #6c7a89;
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 19px;
            font-weight: bold;
            color: #1b4f7a;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;

            background-color: #0875e1;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background-color: #065db5;
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #8a9aaa;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="wifi-card">

            <div class="wifi-icon">📶</div>

            <h1>FREE WI-FI</h1>

            <div class="restaurant">
                Wimpy
            </div>

            <div class="location">
                Kimberley
            </div>

            <div class="divider"></div>

            <div class="info-box">

                <div class="info-label">
                    Wi-Fi Network
                </div>

                <div class="info-value">
                    WIMPY-GUEST
                </div>

            </div>

            <div class="info-box">

                <div class="info-label">
                    Password
                </div>

                <div class="info-value">
                    12345678
                </div>

            </div>

            <button onclick="copyPassword()">
                Copy Password
            </button>

        </div>

        <div class="footer">
            Scan • Connect • Enjoy
        </div>

    </div>


    <script>

        function copyPassword() {

            navigator.clipboard.writeText("12345678");

            alert("Password copied!");

        }

    </script>

</body>

</html>
