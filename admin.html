<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GuestConnect Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, Helvetica, sans-serif;

            background: #f3f4f6;

            color: #1f2937;

        }


        .top {

            background: #111827;

            color: white;

            padding: 20px;

        }


        .top-inner {

            max-width: 1100px;

            margin: auto;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

        }


        .logo {

            font-size: 25px;

            font-weight: bold;

        }


        .admin-label {

            font-size: 13px;

            opacity: 0.75;

            margin-top: 3px;

        }


        .logout-button {

            background: #374151;

            color: white;

            border: none;

            padding: 10px 15px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

        }


        .container {

            max-width: 1100px;

            margin: 25px auto;

            padding: 0 16px;

        }


        .login-card {

            max-width: 420px;

            margin: 70px auto;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);

        }


        .login-card h1 {

            margin-top: 0;

            text-align: center;

        }


        .login-card p {

            text-align: center;

            color: #6b7280;

        }


        input {

            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;

            margin-top: 6px;

            margin-bottom: 15px;

        }


        label {

            font-size: 13px;

            font-weight: bold;

        }


        .primary-button {

            width: 100%;

            background: #111827;

            color: white;

            border: none;

            padding: 13px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        .message {

            margin-top: 15px;

            text-align: center;

            color: #b91c1c;

            font-size: 14px;

        }


        .section {

            margin-bottom: 25px;

        }


        .section-title {

            font-size: 22px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        .stats-grid {

            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 12px;

        }


        .stat-card {

            background: white;

            padding: 18px;

            border-radius: 14px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.06);

        }


        .stat-label {

            color: #6b7280;

            font-size: 13px;

        }


        .stat-number {

            font-size: 28px;

            font-weight: bold;

            margin-top: 6px;

        }


        .restaurant-card {

            background: white;

            border-radius: 16px;

            padding: 20px;

            margin-bottom: 15px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.06);

        }


        .restaurant-header {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 15px;

        }


        .restaurant-name {

            font-size: 21px;

            font-weight: bold;

        }


        .restaurant-location {

            color: #6b7280;

            margin-top: 4px;

        }


        .visit-number {

            font-size: 24px;

            font-weight: bold;

            text-align: right;

        }


        .visit-label {

            font-size: 12px;

            color: #6b7280;

        }


        .today-warning {

            display: inline-block;

            margin-top: 8px;

            background: #fee2e2;

            color: #991b1b;

            padding: 5px 9px;

            border-radius: 7px;

            font-size: 12px;

            font-weight: bold;

        }


        .restaurant-details {

            margin-top: 18px;

            padding: 15px;

            background: #f9fafb;

            border-radius: 12px;

        }


        .detail-row {

            margin-bottom: 10px;

        }


        .detail-row:last-child {

            margin-bottom: 0;

        }


        .detail-label {

            font-size: 12px;

            color: #6b7280;

        }


        .detail-value {

            font-weight: bold;

            word-break: break-word;

        }


        .actions {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 18px;

        }


        .action-button {

            border: none;

            padding: 10px 13px;

            border-radius: 9px;

            cursor: pointer;

            font-weight: bold;

            font-size: 13px;

        }


        .open-button {

            background: #e0e7ff;

            color: #3730a3;

        }


        .qr-button {

            background: #dcfce7;

            color: #166534;

        }


        .edit-button {

            background: #fef3c7;

            color: #92400e;

        }


        .delete-button {

            background: #fee2e2;

            color: #991b1b;

        }


        .regenerate-button {

            background: #ede9fe;

            color: #5b21b6;

        }


        .add-card {

            background: white;

            padding: 22px;

            border-radius: 16px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.06);

        }


        .form-grid {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 15px;

        }


        .full {

            grid-column: 1 / -1;

        }


        .add-button {

            background: #111827;

            color: white;

            border: none;

            padding: 12px 18px;

            border-radius: 9px;

            font-weight: bold;

            cursor: pointer;

        }


        .empty {

            background: white;

            padding: 30px;

            border-radius: 16px;

            text-align: center;

            color: #6b7280;

        }


        #dashboard {

            display: none;

        }


        #qrModal {

            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0,0,0,0.65);

            z-index: 1000;

            padding: 20px;

        }


        .qr-box {

            max-width: 420px;

            margin: 50px auto;

            background: white;

            border-radius: 18px;

            padding: 25px;

            text-align: center;

        }


        #qrcode {

            display: flex;

            justify-content: center;

            margin: 20px 0;

        }


        .qr-url {

            background: #f3f4f6;

            padding: 12px;

            border-radius: 9px;

            font-size: 12px;

            word-break: break-all;

            text-align: left;

        }


        .modal-buttons {

            display: flex;

            gap: 10px;

            margin-top: 15px;

        }


        .modal-buttons button {

            flex: 1;

        }


        .close-button {

            background: #e5e7eb;

            color: #111827;

        }


        .download-button {

            background: #111827;

            color: white;

        }


        @media (max-width: 800px) {

            .stats-grid {

                grid-template-columns: repeat(2, 1fr);

            }

        }


        @media (max-width: 600px) {

            .top-inner {

                align-items: flex-start;

            }


            .form-grid {

                grid-template-columns: 1fr;

            }


            .full {

                grid-column: auto;

            }


            .restaurant-header {

                flex-direction: column;

            }


            .visit-number {

                text-align: left;

            }

        }


        @media (max-width: 400px) {

            .stats-grid {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>



<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div id="loginScreen">


    <div class="login-card">

        <h1>
            GuestConnect
        </h1>

        <p>
            Admin Dashboard
        </p>


        <label>
            Email
        </label>

        <input
            id="email"
            type="email"
            placeholder="Admin email">


        <label>
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Password">


        <button
            class="primary-button"
            onclick="login()">

            Login

        </button>


        <div
            id="loginMessage"
            class="message">
        </div>

    </div>


</div>



<!-- =====================================================
     DASHBOARD
===================================================== -->

<div id="dashboard">


    <div class="top">

        <div class="top-inner">

            <div>

                <div class="logo">
                    GuestConnect
                </div>

                <div class="admin-label">
                    Admin Dashboard
                </div>

            </div>


            <button
                class="logout-button"
                onclick="logout()">

                Logout

            </button>

        </div>

    </div>



    <div class="container">


        <!-- =================================================
             STATS
        ================================================= -->

        <div class="section">

            <div class="section-title">
                Overall Visits
            </div>


            <div class="stats-grid">


                <div class="stat-card">

                    <div class="stat-label">
                        Today
                    </div>

                    <div
                        id="todayCount"
                        class="stat-number">

                        0

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Last 7 Days
                    </div>

                    <div
                        id="sevenDayCount"
                        class="stat-number">

                        0

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        Last 30 Days
                    </div>

                    <div
                        id="thirtyDayCount"
                        class="stat-number">

                        0

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        This Year
                    </div>

                    <div
                        id="yearCount"
                        class="stat-number">

                        0

                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-label">
                        All Time
                    </div>

                    <div
                        id="allTimeCount"
                        class="stat-number">

                        0

                    </div>

                </div>


            </div>

        </div>



        <!-- =================================================
             ADD RESTAURANT
        ================================================= -->

        <div class="section">

            <div class="section-title">
                Add Restaurant
            </div>


            <div class="add-card">


                <div class="form-grid">


                    <div>

                        <label>
                            Restaurant name
                        </label>

                        <input
                            id="newName"
                            type="text"
                            placeholder="Wimpy">

                    </div>


                    <div>

                        <label>
                            Location
                        </label>

                        <input
                            id="newLocation"
                            type="text"
                            placeholder="Kimberley">

                    </div>


                    <div>

                        <label>
                            Restaurant ID
                        </label>

                        <input
                            id="newID"
                            type="text"
                            placeholder="wimpy-kimberley">

                    </div>


                    <div>

                        <label>
                            Wi-Fi name
                        </label>

                        <input
                            id="newWifiName"
                            type="text"
                            placeholder="WIMPY-GUEST">

                    </div>


                    <div>

                        <label>
                            Wi-Fi password
                        </label>

                        <input
                            id="newWifiPassword"
                            type="text"
                            placeholder="12345678">

                    </div>


                    <div class="full">

                        <button
                            class="add-button"
                            onclick="addRestaurant()">

                            Add Restaurant

                        </button>

                    </div>


                </div>


                <div
                    id="addMessage"
                    class="message">
                </div>


            </div>

        </div>



        <!-- =================================================
             RESTAURANTS
        ================================================= -->

        <div class="section">

            <div class="section-title">
                Restaurants
            </div>


            <div id="restaurantList">

                Loading restaurants...

            </div>

        </div>


    </div>

</div>



<!-- =====================================================
     QR MODAL
===================================================== -->

<div id="qrModal">


    <div class="qr-box">


        <h2 id="qrTitle">
            Restaurant QR Code
        </h2>


        <div id="qrcode"></div>


        <div
            id="qrUrl"
            class="qr-url">
        </div>


        <div class="modal-buttons">


            <button
                class="action-button close-button"
                onclick="closeQR()">

                Close

            </button>


            <button
                class="action-button download-button"
                onclick="downloadQR()">

                Download QR

            </button>


        </div>


    </div>

</div>



<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://ksrsjhwklrwrfgzkqcbi.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_bLtm1wBIxmZvwLteiMA2tg_BtLHhgGc";


const supabaseClient =
    window.supabase.createClient(

        SUPABASE_URL,

        SUPABASE_PUBLISHABLE_KEY

    );



// =====================================================
// VARIABLES
// =====================================================

let currentQRRestaurant = null;

let restaurantData = [];

let visitData = [];



// =====================================================
// LOGIN
// =====================================================

async function login() {


    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    message.textContent = "Logging in...";


    const { data, error } =

        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        console.error(
            "Login error:",
            error
        );


        message.textContent =
            error.message;


        return;

    }


    message.textContent = "";


    showDashboard();

}



// =====================================================
// LOGOUT
// =====================================================

async function logout() {


    await supabaseClient.auth.signOut();


    document.getElementById(
        "dashboard"
    ).style.display =
        "none";


    document.getElementById(
        "loginScreen"
    ).style.display =
        "block";

}



// =====================================================
// CHECK LOGIN
// =====================================================

async function checkLogin() {


    const { data } =
        await supabaseClient.auth.getUser();


    if (data && data.user) {

        showDashboard();

    }

}



// =====================================================
// SHOW DASHBOARD
// =====================================================

async function showDashboard() {


    document.getElementById(
        "loginScreen"
    ).style.display =
        "none";


    document.getElementById(
        "dashboard"
    ).style.display =
        "block";


    await loadDashboard();

}



// =====================================================
// LOAD DASHBOARD
// =====================================================

async function loadDashboard() {


    await loadRestaurants();

    await loadVisits();

    renderRestaurants();

    renderStats();

}



// =====================================================
// LOAD RESTAURANTS
// =====================================================

async function loadRestaurants() {


    const { data, error } =

        await supabaseClient

            .from("restaurants")

            .select(
                "id, name, location, wifi_name, wifi_password, public_token, created_at"
            )

            .order(
                "name",
                {
                    ascending: true
                }
            );


    if (error) {

        console.error(
            "Restaurant loading error:",
            error
        );


        document.getElementById(
            "restaurantList"
        ).innerHTML =

            `<div class="empty">
                Could not load restaurants.<br><br>
                ${escapeHTML(error.message)}
            </div>`;


        return;

    }


    restaurantData =
        data || [];

}



// =====================================================
// LOAD VISITS
// =====================================================

async function loadVisits() {


    const { data, error } =

        await supabaseClient

            .from("visits")

            .select(
                "id, restaurant_id, visited_at"
            )

            .order(
                "visited_at",
                {
                    ascending: false
                }
            )

            .range(
                0,
                9999
            );


    if (error) {

        console.error(
            "Visit loading error:",
            error
        );


        visitData = [];

        return;

    }


    visitData =
        data || [];

}



// =====================================================
// DATE HELPERS
// =====================================================

function startOfToday() {


    const d =
        new Date();


    d.setHours(
        0,
        0,
        0,
        0
    );


    return d;

}



function startOfSevenDays() {


    const d =
        new Date();


    d.setDate(
        d.getDate() - 6
    );


    d.setHours(
        0,
        0,
        0,
        0
    );


    return d;

}



function startOfThirtyDays() {


    const d =
        new Date();


    d.setDate(
        d.getDate() - 29
    );


    d.setHours(
        0,
        0,
        0,
        0
    );


    return d;

}



function startOfYear() {


    const d =
        new Date(
            new Date().getFullYear(),
            0,
            1
        );


    return d;

}



// =====================================================
// RENDER STATS
// =====================================================

function renderStats() {


    const today =
        startOfToday();


    const seven =
        startOfSevenDays();


    const thirty =
        startOfThirtyDays();


    const year =
        startOfYear();


    let todayCount = 0;

    let sevenCount = 0;

    let thirtyCount = 0;

    let yearCount = 0;


    visitData.forEach(
        function(visit) {


            const date =
                new Date(
                    visit.visited_at
                );


            if (date >= today) {

                todayCount++;

            }


            if (date >= seven) {

                sevenCount++;

            }


            if (date >= thirty) {

                thirtyCount++;

            }


            if (date >= year) {

                yearCount++;

            }

        }
    );


    document.getElementById(
        "todayCount"
    ).textContent =
        todayCount;


    document.getElementById(
        "sevenDayCount"
    ).textContent =
        sevenCount;


    document.getElementById(
        "thirtyDayCount"
    ).textContent =
        thirtyCount;


    document.getElementById(
        "yearCount"
    ).textContent =
        yearCount;


    document.getElementById(
        "allTimeCount"
    ).textContent =
        visitData.length;

}



// =====================================================
// RESTAURANT VISIT COUNT
// =====================================================

function getRestaurantVisits(id) {


    return visitData.filter(

        function(visit) {

            return visit.restaurant_id === id;

        }

    );

}



// =====================================================
// TODAY VISITS
// =====================================================

function getTodayRestaurantVisits(id) {


    const today =
        startOfToday();


    return visitData.filter(

        function(visit) {

            return (

                visit.restaurant_id === id &&

                new Date(
                    visit.visited_at
                ) >= today

            );

        }

    );

}



// =====================================================
// RENDER RESTAURANTS
// =====================================================

function renderRestaurants() {


    const container =
        document.getElementById(
            "restaurantList"
        );


    if (
        !restaurantData ||
        restaurantData.length === 0
    ) {

        container.innerHTML =

            `<div class="empty">
                No restaurants have been added yet.
            </div>`;

        return;

    }


    container.innerHTML = "";


    restaurantData.forEach(

        function(restaurant) {


            const visits =
                getRestaurantVisits(
                    restaurant.id
                );


            const todayVisits =
                getTodayRestaurantVisits(
                    restaurant.id
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "restaurant-card";


            let warning = "";


            if (todayVisits.length === 0) {

                warning =

                    `<div class="today-warning">
                        No visits today
                    </div>`;

            }


            card.innerHTML =

                `
                <div class="restaurant-header">

                    <div>

                        <div class="restaurant-name">
                            ${escapeHTML(restaurant.name)}
                        </div>

                        <div class="restaurant-location">
                            ${escapeHTML(restaurant.location)}
                        </div>

                    </div>


                    <div>

                        <div class="visit-number">
                            ${visits.length}
                        </div>

                        <div class="visit-label">
                            Total Visits
                        </div>

                        ${warning}

                    </div>

                </div>


                <div class="restaurant-details">


                    <div class="detail-row">

                        <div class="detail-label">
                            Restaurant ID
                        </div>

                        <div class="detail-value">
                            ${escapeHTML(restaurant.id)}
                        </div>

                    </div>


                    <div class="detail-row">

                        <div class="detail-label">
                            Wi-Fi Name
                        </div>

                        <div class="detail-value">
                            ${escapeHTML(restaurant.wifi_name)}
                        </div>

                    </div>


                    <div class="detail-row">

                        <div class="detail-label">
                            Wi-Fi Password
                        </div>

                        <div class="detail-value">
                            ${escapeHTML(restaurant.wifi_password)}
                        </div>

                    </div>


                </div>


                <div class="actions">


                    <button
                        class="action-button open-button"
                        onclick="openCustomerPage('${restaurant.public_token}')">

                        Open Customer Page

                    </button>


                    <button
                        class="action-button qr-button"
                        onclick="showQR('${restaurant.id}')">

                        Generate QR

                    </button>


                    <button
                        class="action-button regenerate-button"
                        onclick="regenerateQR('${restaurant.id}')">

                        Regenerate QR

                    </button>


                    <button
                        class="action-button edit-button"
                        onclick="editRestaurant('${restaurant.id}')">

                        Edit

                    </button>


                    <button
                        class="action-button delete-button"
                        onclick="deleteRestaurant('${restaurant.id}')">

                        Delete

                    </button>


                </div>
                `;


            container.appendChild(
                card
            );

        }

    );

}



// =====================================================
// CUSTOMER URL
// =====================================================

function getCustomerUrl(publicToken) {


    const url =
        new URL(
            "restaurant.html",
            window.location.href
        );


    url.searchParams.set(
        "token",
        publicToken
    );


    return url.href;

}



// =====================================================
// OPEN CUSTOMER PAGE
// =====================================================

function openCustomerPage(publicToken) {


    if (!publicToken) {

        alert(
            "This restaurant does not have a QR token."
        );

        return;

    }


    const url =
        getCustomerUrl(
            publicToken
        );


    window.open(
        url,
        "_blank"
    );

}



// =====================================================
// SHOW QR
// =====================================================

function showQR(id) {


    const restaurant =
        restaurantData.find(

            function(item) {

                return item.id === id;

            }

        );


    if (!restaurant) {

        return;

    }


    if (!restaurant.public_token) {

        alert(
            "This restaurant does not have a QR token yet."
        );

        return;

    }


    currentQRRestaurant =
        restaurant;


    const url =
        getCustomerUrl(
            restaurant.public_token
        );


    document.getElementById(
        "qrTitle"
    ).textContent =

        restaurant.name +
        " - " +
        restaurant.location;


    document.getElementById(
        "qrUrl"
    ).textContent =
        url;


    document.getElementById(
        "qrcode"
    ).innerHTML = "";


    new QRCode(

        document.getElementById(
            "qrcode"
        ),

        {
            text: url,

            width: 240,

            height: 240

        }

    );


    document.getElementById(
        "qrModal"
    ).style.display =
        "block";

}



// =====================================================
// CLOSE QR
// =====================================================

function closeQR() {


    document.getElementById(
        "qrModal"
    ).style.display =
        "none";


    document.getElementById(
        "qrcode"
    ).innerHTML = "";


    currentQRRestaurant =
        null;

}



// =====================================================
// DOWNLOAD QR
// =====================================================

function downloadQR() {


    if (!currentQRRestaurant) {

        return;

    }


    const canvas =
        document.querySelector(
            "#qrcode canvas"
        );


    if (!canvas) {

        alert(
            "QR code is not ready yet."
        );

        return;

    }


    const link =
        document.createElement(
            "a"
        );


    link.download =

        currentQRRestaurant.name
            .replace(
                /[^a-z0-9]/gi,
                "-"
            ) +

        "-" +

        currentQRRestaurant.location
            .replace(
                /[^a-z0-9]/gi,
                "-"
            ) +

        "-GuestConnect-QR.png";


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    link.click();

}



// =====================================================
// ADD RESTAURANT
// =====================================================

async function addRestaurant() {


    const name =
        document.getElementById(
            "newName"
        ).value.trim();


    const location =
        document.getElementById(
            "newLocation"
        ).value.trim();


    const id =
        document.getElementById(
            "newID"
        ).value.trim();


    const wifiName =
        document.getElementById(
            "newWifiName"
        ).value.trim();


    const wifiPassword =
        document.getElementById(
            "newWifiPassword"
        ).value.trim();


    const message =
        document.getElementById(
            "addMessage"
        );


    message.textContent = "";


    if (
        !name ||
        !location ||
        !id ||
        !wifiName ||
        !wifiPassword
    ) {

        message.textContent =
            "Please fill in all fields.";

        return;

    }


    const publicToken =
        crypto.randomUUID();


    const { error } =

        await supabaseClient

            .from("restaurants")

            .insert({

                id: id,

                name: name,

                location: location,

                wifi_name: wifiName,

                wifi_password: wifiPassword,

                public_token: publicToken

            });


    if (error) {

        console.error(
            "Add restaurant error:",
            error
        );


        message.textContent =
            error.message;


        return;

    }


    message.textContent =
        "Restaurant added successfully.";


    document.getElementById(
        "newName"
    ).value = "";


    document.getElementById(
        "newLocation"
    ).value = "";


    document.getElementById(
        "newID"
    ).value = "";


    document.getElementById(
        "newWifiName"
    ).value = "";


    document.getElementById(
        "newWifiPassword"
    ).value = "";


    await loadDashboard();

}



// =====================================================
// EDIT RESTAURANT
// =====================================================

async function editRestaurant(id) {


    const restaurant =
        restaurantData.find(

            function(item) {

                return item.id === id;

            }

        );


    if (!restaurant) {

        return;

    }


    const name =
        prompt(
            "Restaurant name:",
            restaurant.name
        );


    if (name === null) {

        return;

    }


    const location =
        prompt(
            "Location:",
            restaurant.location
        );


    if (location === null) {

        return;

    }


    const wifiName =
        prompt(
            "Wi-Fi name:",
            restaurant.wifi_name
        );


    if (wifiName === null) {

        return;

    }


    const wifiPassword =
        prompt(
            "Wi-Fi password:",
            restaurant.wifi_password
        );


    if (wifiPassword === null) {

        return;

    }


    const { error } =

        await supabaseClient

            .from("restaurants")

            .update({

                name: name.trim(),

                location: location.trim(),

                wifi_name: wifiName.trim(),

                wifi_password:
                    wifiPassword.trim()

            })

            .eq(
                "id",
                id
            );


    if (error) {

        alert(
            "Could not update restaurant:\n\n" +
            error.message
        );

        return;

    }


    await loadDashboard();

}



// =====================================================
// REGENERATE QR TOKEN
// =====================================================

async function regenerateQR(id) {


    const restaurant =
        restaurantData.find(

            function(item) {

                return item.id === id;

            }

        );


    if (!restaurant) {

        return;

    }


    const confirmed =
        confirm(

            "Regenerate the QR code for " +

            restaurant.name +

            " - " +

            restaurant.location +

            "?\n\n" +

            "The old QR code will stop working."

        );


    if (!confirmed) {

        return;

    }


    const newToken =
        crypto.randomUUID();


    const { error } =

        await supabaseClient

            .from("restaurants")

            .update({

                public_token:
                    newToken

            })

            .eq(
                "id",
                id
            );


    if (error) {

        alert(
            "Could not regenerate QR:\n\n" +
            error.message
        );

        return;

    }


    alert(
        "New QR token created successfully.\n\n" +
        "The old QR code is now invalid."
    );


    await loadDashboard();

}



// =====================================================
// DELETE RESTAURANT
// =====================================================

async function deleteRestaurant(id) {


    const restaurant =
        restaurantData.find(

            function(item) {

                return item.id === id;

            }

        );


    if (!restaurant) {

        return;

    }


    const confirmed =
        confirm(

            restaurant.location +

            "?\n\n" +

    const { error } =

        await supabaseClient

            .from("restaurants")

    if (error) {

            "Could not delete restaurant:\n\n" +

        );

    await loadDashboard();

}



// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {


    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
